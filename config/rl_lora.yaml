# =============================================
# LoRA GRPO RL Training Config
# =============================================
# NOTE: Default parameters below are tuned for 8xH200 GPUs training a 2B model.
# Please adjust batch_size, learning_rate, and related parameters based on your hardware.

# Model (merged SFT model path)
model_path: "output/sft/XXXX_XX/qwen3vl-merged"   # TODO: set your checkpoint
output_dir: "output/rl"

# Dataset
dataset: "Datasets/RL.jsonl"
max_length: 6000

# DeepSpeed stage: 2 or 3. Use 3 when GPU memory is limited.
deepspeed_stage: 2

# Training args (only the specified subset)
training_args:
  learning_rate: 1.0e-5
  per_device_train_batch_size: 6
  gradient_checkpointing: true
  save_steps: 500
  gradient_accumulation_steps: 3
  num_train_epochs: 3
  save_total_limit: 8

# LoRA config
lora_rank: 64
lora_alpha: 128

# Freeze strategy
freeze_llm: false
freeze_vit: true
freeze_aligner: false

# GRPO hyperparameters
grpo:
  num_generations: 8
  max_completion_length: 2548
  epsilon: 0.2
  beta: 0.01
  loss_type: "sapo"
  scale_rewards: "batch"
  use_vllm: true
  vllm_gpu_memory_utilization: 0.4

# Cosine length penalty
cosine:
  min_len_value_wrong: -0.5
  max_len_value_wrong: 0.0
  min_len_value_correct: 1.0
  max_len_value_correct: 0.5

# Repetition penalty
repetition:
  n_grams: 3
  max_penalty: -1.0

# ARSPO dynamic reward balancing hyperparameters
# Ratios are calibrated on 82239 total steps. They will be auto-scaled
# to the actual total_steps (rounded to nearest 100).
arspo:
  update_interval_ratio: 0.0049
  warmup_steps_ratio: 0.146
  baseline_collect_start_ratio: 0.085
